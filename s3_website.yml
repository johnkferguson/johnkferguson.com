s3_id: <%= ENV['JOHN_K_FERGUSON_ACCESS_KEY_ID'] %>
s3_secret: <%= ENV['JOHN_K_FERGUSON_SECRET_ACCESS_KEY'] %>
s3_bucket: johnkferguson.com
cloudfront_distribution_id: <%= JOHN_K_FERGUSON_CLOUDFRONT_DISTRIBUTION_ID %>

s3_reduced_redundancy: true
max_age:
  "assets/images/*": <%= 60 * 60 * 24 * 7 %>
  "*": <%= 60 * 60 * 24 %>
gzip: true

cloudfront_distribution_config:
  default_cache_behavior:
    min_TTL: <%= 60 * 60 * 24 %>

cloudfront_invalidate_root: true

concurrency_level: 60
