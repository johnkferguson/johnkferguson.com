backend:
  name: git-gateway
  branch: master

publish_mode: editorial_workflow

media_folder: "assets/uploads"

collections:
  - name: "post"
    label: "Post"
    folder: "_posts"
    create: true
    slug: "{{slug}}"
    fields:
      - {label: "Layout", name: "layout", widget: "hidden", default: "post"}
      - {label: "Title", name: "title", widget: "string"}
      - {label: "Date", name: "date", widget: "datetime"}
