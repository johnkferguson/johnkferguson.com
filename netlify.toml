[build]
publish = "dist"
command = "bash scripts/netlify-build.sh"

# Pretty URLs is on by default and rewrites /about and /about.html to /about/.
# Off, with build.format "file" in astro.config.mjs, /about serves directly.
# Redirect rules cannot do this: Netlify normalizes trailing slashes before
# rules run. Overrides the UI toggle under Build & deploy > Post processing.
[build.processing.html]
pretty_urls = false

[build.environment]
# Netlify installs dependencies itself (`pnpm install`, since pnpm-lock.yaml is
# present) with the pnpm that packageManager in package.json names, through
# corepack. pnpm-workspace.yaml's 7-day wait and install-script rules apply to
# that install too.
NODE_VERSION = "24"
# Install exactly what pnpm-lock.yaml lists, as CI does.
PNPM_FLAGS = "--frozen-lockfile"
