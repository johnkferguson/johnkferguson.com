name: Security Audit

# Scheduled because new advisories are published against dependencies we
# already have pinned — a vulnerability can appear without any commit here.
# GitHub's dependency graph does not parse bun.lock, so Dependabot alerts see
# only our direct deps; `bun audit` covers the full transitive tree and is the
# only thing that does.
on:
  schedule:
    # 06:00 UTC daily, ahead of the Monday Dependabot run.
    - cron: "0 6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "package.json"
      - "bun.lock"
      - "scripts/audit.sh"
      - ".github/workflows/security.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - run: bun install --frozen-lockfile

      # Full report at every severity, always shown, never fails the run.
      # Gives visibility into the moderate and low findings the gate ignores.
      - name: Audit report (informational)
        run: bun audit || true

      # Same gate the PR check runs. Ignore list and its reasoning live in the
      # script so the two callers cannot drift apart.
      - name: Fail on new high or critical advisories
        run: ./scripts/audit.sh
