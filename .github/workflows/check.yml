name: Check

on:
  pull_request:
  push:
    branches: [main]
  # Re-run the gate without pushing: after a flake, or to confirm main is
  # still green following something that did not arrive as a PR.
  workflow_dispatch:

# Cancel a stale run when new commits land on the same ref.
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

# Specifying any key sets every other scope to none. Nothing here needs write.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    # Otherwise inherits the 360-minute default, holding a live token for six
    # hours if a step hangs.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          # The git token is otherwise left on disk for later steps. Safe here:
          # nothing after checkout does git operations (the scripts/ font tools
          # are run manually, not in CI).
          persist-credentials: false
          # On a PR, the merge commit and its first parent, the base branch,
          # which the npq step compares the lockfile with.
          fetch-depth: 2
      # Static security analysis of the workflows themselves: template
      # injection, over-broad permissions, credential persistence, unsafe
      # triggers. advanced-security is off because this repo has no GHAS, so
      # findings surface as inline annotations instead of a SARIF upload.
      - uses: zizmorcore/zizmor-action@v0.6.4
        with:
          advanced-security: false
          # The input is `annotations`; `inline-annotations` was accepted
          # silently as unknown, leaving it at its default of false. Zizmor
          # ran and reported nothing inline until this was corrected.
          annotations: true
          min-severity: low
          config: zizmor.yml
      # Fails when a workflow, script or config downloads and runs a tool
      # outside the lockfile; the script lists the patterns.
      - run: bash scripts/check-no-downloaded-tools.sh
      # Installs the pnpm version named by packageManager in package.json.
      - uses: pnpm/action-setup@v6.1.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
      # Tests and repo scripts run on bun; pnpm installs and runs the rest.
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version-file: .bun-version
      # No dependency cache: an uncached install takes seconds, and it keeps
      # cache poisoning out.
      - run: pnpm install --frozen-lockfile
      # Gates PRs on high and critical advisories (audit settings and ignore
      # list in pnpm-workspace.yaml).
      - run: pnpm audit
      # --pass-with-no-tests: unit tests live on feature branches until they
      # merge; a branch with zero test files should not fail the check
      - run: bun test --pass-with-no-tests
      - run: pnpm run check
      - run: pnpm exec astro check
      - run: pnpm run build
      # Reads dist/, so it cannot be a bun:test: those run before the build,
      # and one that skipped on a missing dist/ would assert nothing.
      - run: bun scripts/check-canonicals.ts
      - uses: actions/cache@v6.1.0
        with:
          path: .lycheecache
          key: lychee-${{ github.sha }}
          restore-keys: lychee-
      - uses: lycheeverse/lychee-action@v2.9.0
        with:
          args: "--config .lychee.toml --root-dir ./dist --remap 'https://johnkferguson\\.com file://${{ github.workspace }}/dist' --cache --max-cache-age 1d --no-progress './dist/**/*.html'"
          fail: true
      # npq checks the direct dependencies this PR adds or changes; errors
      # fail unless .npq-allow lists them. After the build and tests, so a
      # dependency PR that npq fails still shows whether it builds. The token
      # keeps npq's GitHub API calls under the rate limit.
      - name: Check new and changed dependencies with npq
        if: github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node .claude/skills/npq-check/check.mjs --base HEAD^1
      # Fails when actions.lock is out of sync with the workflows or a locked
      # commit no longer verifies upstream. Last, so a failure here still shows
      # the build and test results above. Keep the pin below in step with CLAUDE.md.
      - name: Verify actions.lock
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh extension install github/gh-actions-lock --pin v0.4.1
          gh actions-lock --verify

  # Separate from `check` rather than appended to it: this job drives a real
  # Chrome over every built page, and a browser that hangs should not hold up
  # lint and test feedback. It runs concurrently, so it costs no wall clock.
  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6.1.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version-file: .bun-version
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      # Chrome is preinstalled on the runner image; CHROME_PATH stops
      # chrome-launcher guessing and keeps a failure here legible.
      - run: pnpm run lighthouse
        env:
          CHROME_PATH: /usr/bin/google-chrome
      # A failing category assertion names the category, not the element
      # behind it. The full reports are what make that diagnosable.
      - uses: actions/upload-artifact@v7.0.2
        if: failure()
        with:
          name: lighthouse-reports
          path: .lighthouse/reports/
          retention-days: 7
